name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-build-go:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache: false
        
    - name: Prepare Go Modules
      working-directory: ./api
      run: go mod tidy

    - name: Run golangci-lint manually
      working-directory: ./api
      run: |
        curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.64.8
        $(go env GOPATH)/bin/golangci-lint run -v --timeout=5m
        
    - name: Run Go Tests
      working-directory: ./api
      run: |
        go mod tidy
        go test ./...
      
    - name: Build Go Docker Image
      run: docker build -f api/Dockerfile -t thitipongroo/omni-go-api:latest .

  test-and-build-scraper:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        
    - name: Install Scraper Dependencies
      working-directory: ./scraper
      run: npm install
      
    - name: Run ESLint
      working-directory: ./scraper
      run: |
        npm install eslint @eslint/js --save-dev
        npx eslint index.js
        
    - name: Build Playwright Docker Image
      run: docker build -t thitipongroo/omni-scraper:latest ./scraper